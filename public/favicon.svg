<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3a833;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e29722;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="5" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Circle (Ball Shape) -->
  <circle cx="256" cy="256" r="230" fill="#1a1a1a" />
  <circle cx="256" cy="256" r="215" fill="url(#brandGrad)" />
  
  <!-- Soccer Ball Pattern (Pentagons and Lines) -->
  <g fill="#0f0f0f" filter="url(#shadow)">
    <!-- Center Pentagon -->
    <path d="M256 160 l70 50 l-25 85 h-90 l-25 -85 z" />
    
    <!-- Top Pentagon (Partial) -->
    <path d="M256 40 l40 30 v40 l-40 30 l-40 -30 v-40 z" opacity="0.8" />
    
    <!-- Bottom Left Pentagon (Partial) -->
    <path d="M100 380 l40 -20 l50 30 l10 50 l-60 20 z" opacity="0.8" />
    
    <!-- Bottom Right Pentagon (Partial) -->
    <path d="M412 380 l-40 -20 l-50 30 l-10 50 l60 20 z" opacity="0.8" />
    
    <!-- Top Left Pentagon (Partial) -->
    <path d="M80 180 l50 -10 l30 50 l-20 50 l-60 -20 z" opacity="0.8" />
    
    <!-- Top Right Pentagon (Partial) -->
    <path d="M432 180 l-50 -10 l-30 50 l20 50 l60 -20 z" opacity="0.8" />
  </g>

  <!-- Connecting Lines for Soccer Feel -->
  <g stroke="#0f0f0f" stroke-width="8" opacity="0.3">
    <line x1="256" y1="160" x2="256" y2="140" />
    <line x1="326" y1="210" x2="382" y2="170" />
    <line x1="301" y1="295" x2="372" y2="360" />
    <line x1="211" y1="295" x2="140" y2="360" />
    <line x1="186" y1="210" x2="130" y2="170" />
  </g>
  
  <!-- Live Indicator (Small Dot) -->
  <circle cx="410" cy="110" r="35" fill="#ff0000">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>